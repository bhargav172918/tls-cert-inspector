name: SSL Expiration Daily Check

on:
  schedule:
    # Runs daily at 08:00 AM IST (02:30 AM UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  check-ssl-certs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute SSL Inspection Script
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DOMAINS: ${{ vars.DOMAINS }}
          WARNING_THRESHOLD_DAYS: ${{ vars.WARNING_THRESHOLD_DAYS }}
        run: python cert_inspector.py